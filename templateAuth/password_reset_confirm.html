<h2>Redefinir senha</h2>

{% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Alterar senha</button>
  </form>
{% else %}
  <p>Esse link de redefinição de senha não é mais válido. Solicite um novo.</p>
  <a href="{% url 'password_reset' %}" target="_blank">Recuperar senha</a>
{% endif %}
