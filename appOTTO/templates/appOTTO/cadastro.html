{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'appOTTO/css/forms.css' %}">
</head>
<body>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <h1>Cadastro</h1>
    <form method="POST">
        {% csrf_token %}

        <label for="nome_usuario">Nome:</label>
        <input type="text" id="nome_usuario" name="nome_usuario" required><br><br>

        <label for="email_usuario">E-mail:</label>
        <input type="email" id="email_usuario" name="email_usuario" required><br><br>

        <label for="senha_usuario">Senha:</label>
        <input type="password" id="senha_usuario" name="senha_usuario" required><br><br>

        <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem conta?<a href="{% url 'login' %}">Clique aqui</a></p>
</body>
</html>
