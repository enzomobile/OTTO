{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'appOTTO/CSS/cores.css' %}">
    <link rel="stylesheet" href="{% static 'appOTTO/CSS/pos_fase.css' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'appOTTO/img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'appOTTO/img/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'appOTTO/img/favicon-16x16.png' %}">
    <link rel="icon" href="{% static 'appOTTO/img/favicon.ico' %} ">
    <script src="{% static 'appOTTO/JS/trocarTema.js' %}"></script>
    <script src="{% static 'appOTTO/JS/navegacaoTI.js' %}"></script>
    <title>Fase Concluida</title>
</head>
<body>
    <div class="container">
        <main>
            <section class="corpo">
                <img src="{% static 'appOTTO/img/OTTO_concluir.png' %}" alt="">
                <div class="tempo">
                    <p class="tempo-titulo">Tempo</p>
                    <p class="tempo-conteudo">{{ tempo }}</p>
                </div>
                <a href="{% url 'dashboard' %}">Continuar</a>
            </section>
        </main>
    </div>
</body>
</html>
