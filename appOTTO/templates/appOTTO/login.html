{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'appOTTO/css/login.css' %}">
    <title>Cadastro</title>
</head>
<body>
    <div class="container">
        <nav>
            <div class="voltar">
                <a class="btn-voltar" data-url="{% url 'home' %}"><img src="{% static 'appOTTO/img/141987.png' %}" class="voltar-OTTO"></a>
            </div>
        </nav>
        <header>
            <section class="cadastro">
                <div class="informação">
                    <form method="POST" action="{% url 'login' %}" novalidate>
                        {% csrf_token %}
                        <h2>Conectar Conta</h2>
                        <label for="usuario"></label>
                        <input type="email" id="email_usuario" name="email_usuario" required placeholder="NOME DE USUARIO/EMAIL">
                        <div class="form-senha">
                            <label for="senha"></label>
                            <input type="password" id="senha_usuario" name="senha_usuario" required placeholder="SENHA">
                            <button class="button-senha">ESQUECEU A SENHA?</button>
                        </div>
                        <div class="container-button-logar">
                            <button class="button-logar" type="submit">LOGAR</button>
                        </div>
                    </form>
                    <div class="google">
                        <div class="google-button">
                            <a href="{% url 'social:begin' 'google-oauth2' %}">
                                <a><img src="{% static 'appOTTO/img/Google__G__logo.svg.png' %}" alt="Logo Google" class="img-google"></a>
                                <p class="text-google">Continuar com o Google</p>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
            <section class="animação">
                <a><img src="{% static 'appOTTO/img/cadastro.png' %}" alt=""></a>
            </section>
        </header>
        <footer>
            <ul class="rodapé">
                <li class="rodapé-info">Brasil<a href=""></a></li>
                |
                <li class="rodapé-info">Termos de Uso<a href=""></a></li>
                |
                <li class="rodapé-info">Sobre Nós<a href=""></a></li>
                |
                <li class="rodapé-info">Contato<a href=""></a></li>
            </ul>
        </footer>
    </div>

    <script src="{% static 'appOTTO/js/home.js' %}"></script>
</body>
</html>
