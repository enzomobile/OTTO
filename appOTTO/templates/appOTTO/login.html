{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'appOTTO/css/forms.css' %}">
</head>
<body>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}

        <label for="email_usuario">E-mail:</label>
        <input type="email" id="email_usuario" name="email_usuario" required><br><br>

        <label for="senha_usuario">Senha:</label>
        <input type="password" id="senha_usuario" name="senha_usuario" required><br><br>

        <button type="submit">Logar</button>

        <p>Ou entre com:</p>

        <div class="google-btn-container">
            <a href="{% url 'social:begin' 'google-oauth2' %}">
                <button type="button" class="botao-google">
                    <img src="{% static 'appOTTO/img/google-icon.svg' %}" alt="Google" width="20" height="20">
                    Entrar com Google
                </button>
            </a>
        </div>
    </form>
    <p>Não tem uma conta?<a href="{% url 'cadastro' %}">Clique aqui</a></p>
</body>
</html>
