{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'appOTTO/css/forms.css' %}">
</head>
<body>
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}

        <label for="id_email">E-mail:</label>
        <input type="email" id="id_email" name="email" required><br><br>

        <label for="id_senha">Senha:</label>
        <input type="password" id="id_senha" name="senha" required><br><br>

        <button type="submit">Cadastrar</button>
    </form>
    <p>Não tem uma conta?<a href="{% url 'cadastro' %}">Clique aqui</a></p>
</body>
</html>
